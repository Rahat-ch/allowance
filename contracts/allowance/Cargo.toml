[package]
name = "allowance"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = { version = "1.8.1", features = ["derive"] }
hex = "0.4.3"
near-sdk = "5.30.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
